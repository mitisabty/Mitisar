<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Background Example</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: #ffffff;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Background Video Styling */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            z-index: -2; /* Video ko sabse piche rakhne ke liye */
        }

        /* Dark Overlay taaki text clear dikhe */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Yahan opacity kam/zyada kar sakte ho */
            z-index: -1;
        }

        /* Content Styling */
        .content {
            z-index: 1;
            max-width: 700px;
            padding: 0 20px;
        }

        .content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .content p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        /* Interactive Button (JS Trigger) */
        .explore-btn {
            background-color: #ffffff;
            color: #000000;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .explore-btn:hover {
            background-color: #d4d4d4;
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 2.3rem;
            }
            .content p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Background Video File -->
        <!-- Apni video ka naam yahan 'VID.mp4' ki jagah likh dena -->
        <video autoplay muted loop playsinline class="bg-video">
            <source src="VID.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <!-- Dark Overlay -->
        <div class="video-overlay"></div>

        <!-- Main Content -->
        <div class="content">
            <h1>Cinematic Web Experience</h1>
            <p>Built with pure HTML, CSS, and JavaScript featuring a smooth background video layout.</p>
            <button class="explore-btn" id="alertBtn">Click Me</button>
        </div>
    </section>

    <!-- JavaScript code -->
    <script>
        // Simple JS interactivity
        const btn = document.getElementById('alertBtn');
        
        btn.addEventListener('click', function() {
            alert('Awesome! Your video background website is working perfectly.');
        });
    </script>

</body>
</html>
